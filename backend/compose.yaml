services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-library}
      POSTGRES_USER: ${POSTGRES_USER:-library}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in backend/.env}
    volumes:
      - library-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-library} -d ${POSTGRES_DB:-library}"]
      interval: 5s
      timeout: 3s
      retries: 10
  ocr-app:
    image: ferraripupu/ocr-app:latest
    restart: unless-stopped
  migrate:
    build: .
    command: ["uv", "run", "alembic", "upgrade", "head"]
    env_file: .env
    depends_on:
      db: {condition: service_healthy}
  api:
    build: .
    env_file: .env
    ports: ["127.0.0.1:8000:8000"]
    depends_on:
      migrate: {condition: service_completed_successfully}
      ocr-app: {condition: service_started}
  worker:
    build: .
    command: ["uv", "run", "python", "worker.py"]
    env_file: .env
    depends_on:
      migrate: {condition: service_completed_successfully}
      ocr-app: {condition: service_started}
volumes:
  library-data:
