name: Backend CI
on:
  push:
    paths: ["backend/**", ".github/workflows/backend-ci.yml"]
  pull_request:
    paths: ["backend/**", ".github/workflows/backend-ci.yml"]
  workflow_dispatch:
jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: library
          POSTGRES_USER: library
          POSTGRES_PASSWORD: library
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U library -d library"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://library:library@localhost:5432/library
      JWT_SECRET: ci-test-secret-with-at-least-32-characters
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --locked --extra dev
      - run: uv run --locked --extra dev ruff check .
      - run: uv run --locked --extra dev ruff format --check .
      - run: |
          cp .env.example .env
          docker compose config -q
          docker compose up --build -d --wait
      - run: uv run --locked --extra dev alembic upgrade head
      - run: uv run --locked --extra dev python -m pytest
        env:
          SMOKE_URL: http://127.0.0.1:8000
      - if: failure()
        run: docker compose logs
