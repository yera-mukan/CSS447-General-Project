apiVersion: v1
kind: Service
metadata:
  name: ocr
  namespace: ocr-lab
  labels:
    app: ocr
spec:
  # ClusterIP only: the port is NOT exposed to the internet. Reach it with
  # `kubectl port-forward` (localhost only) or from inside the cluster.
  type: ClusterIP
  selector:
    # Sends traffic only to pods with this label that are Ready.
    app: ocr
  ports:
    - name: http
      port: 8884
      targetPort: 8884
