apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Smallest reproducible unit: namespace + Deployment + Service.
resources:
  - namespace.yaml
  - deployment.yaml
  - service.yaml
  - service-nodeport.yaml

labels:
  - pairs:
      app.kubernetes.io/part-of: ocr-autoscaling-lab
    includeSelectors: false
