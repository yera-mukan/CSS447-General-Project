apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Scenario A: fixed number of replicas, no autoscalers at all.
# N=3 was confirmed in Stage 5: it is also the HPA maximum on this node,
# so A is a fair "always at max" baseline. (3*400m + 780m system = 1980m.)
resources:
  - ../../base

replicas:
  - name: ocr
    count: 3
