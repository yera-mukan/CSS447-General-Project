apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: ocr
  namespace: ocr-lab
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: ocr
  minReplicas: 1
  maxReplicas: 3
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          # Same as the best B scenario (B-hpa-50) for a fair comparison.
          averageUtilization: 50
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0
    scaleDown:
      stabilizationWindowSeconds: 120
